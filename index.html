<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff4e8">
  <title>云养小猫</title>

  <style>
    :root {
      --bg: #fff8ef;
      --card: rgba(255, 255, 255, 0.9);
      --text: #3e342e;
      --muted: #82756c;
      --orange: #ef7f3c;
      --orange2: #ffb276;
      --line: rgba(126, 91, 65, 0.14);
      --shadow: 0 18px 55px rgba(92, 64, 45, 0.14);
      --danger: #a84e55;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100svh;
      font-family:
        ui-rounded,
        "SF Pro Rounded",
        "PingFang SC",
        "Microsoft YaHei",
        system-ui,
        sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 8%, #ffe1c8 0 8%, transparent 28%),
        radial-gradient(circle at 90% 82%, #ffdce5 0 9%, transparent 31%),
        linear-gradient(145deg, #fffaf3, #fff0e5);
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      touch-action: manipulation;
    }

    .app {
      width: min(100%, 780px);
      min-height: 100svh;
      margin: auto;
      padding:
        max(18px, env(safe-area-inset-top))
        16px
        max(26px, env(safe-area-inset-bottom));
    }

    .screen {
      display: none;
      animation: fade 0.25s ease;
    }

    .screen.active {
      display: block;
    }

    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(7px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .hero,
    .panel,
    .home-card,
    .log-card {
      border: 1px solid rgba(255, 255, 255, 0.94);
      border-radius: 28px;
      background: var(--card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: var(--shadow);
    }

    .hero,
    .panel {
      padding: 24px;
    }

    .hero {
      text-align: center;
    }

    .logo {
      width: 140px;
      height: 140px;
      display: grid;
      place-items: center;
      margin: 2px auto 18px;
      border-radius: 40px;
      background: linear-gradient(145deg, #fff, #ffe1c3);
      box-shadow: 0 16px 38px rgba(171, 98, 48, 0.15);
    }

    .logo svg {
      width: 108px;
      height: 108px;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 8px;
      font-size: clamp(34px, 9vw, 52px);
      letter-spacing: -0.05em;
    }

    h2 {
      margin-bottom: 8px;
      font-size: clamp(27px, 7vw, 38px);
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin-bottom: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .section-title {
      margin: 24px 4px 12px;
      font-size: 18px;
    }

    .route-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .route-card,
    .adult-card {
      min-height: 132px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 22px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.85);
      box-shadow: 0 10px 28px rgba(105, 73, 51, 0.08);
      text-align: left;
      transition: 0.18s;
    }

    .route-card:active,
    .adult-card:active,
    .action-btn:active,
    .primary:active,
    .secondary:active,
    .tiny-btn:active {
      transform: scale(0.97);
    }

    .route-card:hover,
    .adult-card:hover {
      border-color: rgba(233, 119, 49, 0.42);
    }

    .route-icon {
      display: block;
      margin-bottom: 8px;
      font-size: 32px;
    }

    .route-name {
      display: block;
      margin-bottom: 5px;
      font-size: 16px;
      font-weight: 900;
    }

    .route-desc {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.48;
    }

    .continue-box {
      display: none;
      margin-top: 16px;
      padding: 16px;
      border-radius: 20px;
      background: #fff1df;
      text-align: left;
    }

    .continue-box.show {
      display: block;
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }

    .primary,
    .secondary {
      min-height: 52px;
      padding: 12px 16px;
      border-radius: 17px;
      font-weight: 900;
    }

    .primary {
      color: #fff;
      background: linear-gradient(135deg, var(--orange2), var(--orange));
      box-shadow: 0 12px 26px rgba(231, 111, 49, 0.26);
    }

    .secondary {
      color: #675b53;
      background: #f3ece7;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 14px;
      padding: 8px 11px;
      border-radius: 13px;
      color: #6d6159;
      background: #f4ede8;
      font-weight: 850;
    }

    .choice-list {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }

    .adult-card {
      width: 100%;
      min-height: 116px;
    }

    .adult-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 7px;
      font-weight: 900;
    }

    .personality-tag {
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
    }

    .spirit {
      color: #2d7b50;
      background: #dcf5e6;
    }

    .demon {
      color: #ad5a1f;
      background: #ffead3;
    }

    .chaos {
      color: #94333f;
      background: #ffe0e4;
    }

    .candidate {
      text-align: center;
    }

    .candidate-art {
      height: 230px;
      margin: 8px 0 16px;
      overflow: hidden;
      border-radius: 24px;
      background: #fff5e6;
    }

    .candidate-art svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .origin-story {
      margin: 14px 0;
      padding: 14px;
      border-radius: 18px;
      color: #665a52;
      background: #fff4e8;
      line-height: 1.65;
      text-align: left;
    }

    .candidate-meta {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin: 16px 0;
      text-align: left;
    }

    .meta-box {
      padding: 12px;
      border-radius: 16px;
      background: #f8f2ed;
    }

    .meta-box small {
      display: block;
      margin-bottom: 4px;
      color: #9a8d83;
      font-weight: 800;
    }

    .name-input {
      width: 100%;
      min-height: 56px;
      padding: 0 16px;
      border: 1.5px solid var(--line);
      border-radius: 17px;
      outline: none;
      background: #fff;
      font-size: 17px;
    }

    .name-input:focus {
      border-color: rgba(233, 119, 49, 0.55);
      box-shadow: 0 0 0 4px rgba(255, 155, 88, 0.12);
    }

    .home-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .home-top h2 {
      margin: 0;
      font-size: 23px;
    }

    .top-buttons {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .day-chip,
    .tiny-btn {
      padding: 8px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
    }

    .day-chip {
      color: #9c551f;
      background: #fff0dd;
    }

    .tiny-btn {
      color: #665a52;
      background: rgba(255, 255, 255, 0.84);
      box-shadow: 0 8px 22px rgba(93, 66, 47, 0.09);
    }

    .home-card {
      padding: 16px;
    }

    .room-frame {
      position: relative;
      overflow: hidden;
      border-radius: 24px;
      background: #f5e8d6;
      aspect-ratio: 16 / 10;
    }

    #roomArt {
      position: absolute;
      inset: 0;
    }

    .room-frame svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .room-caption {
      position: absolute;
      left: 12px;
      bottom: 12px;
      max-width: 72%;
      padding: 9px 12px;
      border-radius: 14px 14px 14px 4px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 8px 22px rgba(72, 52, 39, 0.12);
      font-size: 13px;
      line-height: 1.4;
    }

    .room-damage-label {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 7px 10px;
      border-radius: 999px;
      color: #805f4e;
      background: rgba(255, 255, 255, 0.86);
      font-size: 12px;
      font-weight: 900;
    }

    .cat-summary {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
    }

    .cat-name {
      margin: 0 0 4px;
      font-size: 27px;
    }

    .cat-sub {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .stats-compact {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
      margin-top: 14px;
    }

    .stat-card {
      padding: 11px;
      border: 1px solid rgba(127, 93, 68, 0.09);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.78);
    }

    .stat-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 7px;
      font-size: 12px;
      font-weight: 850;
    }

    .bar {
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: #eee5df;
    }

    .bar span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #ffb577, #f17f3b);
      transition: width 0.25s;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .action-btn {
      min-height: 76px;
      padding: 12px;
      border-radius: 19px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 10px 25px rgba(101, 70, 48, 0.08);
      font-weight: 900;
      text-align: left;
    }

    .action-btn span {
      display: block;
      margin-bottom: 4px;
      font-size: 25px;
    }

    .action-btn small {
      color: var(--muted);
      font-weight: 700;
    }

    .action-btn:disabled {
      opacity: 0.44;
    }

    .status-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 13px;
      padding: 11px 13px;
      border-radius: 17px;
      background: #f7eee8;
      font-size: 13px;
      font-weight: 850;
    }

    .log-card {
      margin-top: 14px;
      padding: 16px;
    }

    .log-card h3 {
      margin-bottom: 10px;
      font-size: 16px;
    }

    .log-list {
      display: grid;
      gap: 8px;
      max-height: 235px;
      overflow: auto;
    }

    .log-item {
      padding: 10px 12px;
      border-radius: 14px;
      color: #665a52;
      background: #faf4ef;
      font-size: 13px;
      line-height: 1.55;
    }

    .small-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .attribute-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .attribute-art {
      height: 230px;
      margin: 14px 0;
      overflow: hidden;
      border-radius: 24px;
      background: #fff3df;
    }

    .attribute-art svg {
      width: 100%;
      height: 100%;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .info-box {
      padding: 13px;
      border-radius: 17px;
      background: #f8f2ed;
    }

    .info-box small {
      display: block;
      margin-bottom: 5px;
      color: #988a80;
      font-weight: 800;
    }

    .personality-detail {
      margin-top: 14px;
      padding: 16px;
      border-radius: 20px;
      background: #fff1df;
    }

    .personality-detail h3 {
      margin-bottom: 7px;
    }

    .personality-detail p {
      margin: 0;
      color: #6c5f56;
      font-size: 14px;
      line-height: 1.65;
    }

    .abandon-corner {
      position: fixed;
      right: 10px;
      bottom: max(10px, env(safe-area-inset-bottom));
      z-index: 50;
      display: none;
      padding: 6px 10px;
      border: 1px solid rgba(151, 71, 71, 0.16);
      border-radius: 999px;
      color: #9b4d4d;
      background: rgba(255, 247, 247, 0.82);
      box-shadow: 0 7px 20px rgba(101, 52, 52, 0.1);
      font-size: 11px;
      font-weight: 850;
      opacity: 0.74;
    }

    .abandon-corner.show {
      display: block;
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      place-items: center;
      padding: 18px;
      background: rgba(45, 35, 29, 0.48);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .overlay.show {
      display: grid;
    }

    .modal-card {
      width: min(92vw, 470px);
      padding: 23px;
      border-radius: 26px;
      background: #fff;
      box-shadow: 0 25px 80px rgba(36, 28, 23, 0.3);
      text-align: center;
      animation: pop 0.26s ease;
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: scale(0.93);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .event-card {
      pointer-events: none;
    }

    .event-emoji {
      margin-bottom: 8px;
      font-size: 64px;
    }

    .event-card h2 {
      font-size: 28px;
    }

    .event-body {
      color: #6d6057;
      line-height: 1.7;
    }

    .effect-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 7px;
      margin-top: 14px;
    }

    .effect-chip {
      padding: 6px 9px;
      border-radius: 999px;
      color: #6c5b50;
      background: #f6eee8;
      font-size: 12px;
      font-weight: 850;
    }

    .tap-hint {
      margin-top: 15px;
      color: #a39287;
      font-size: 12px;
    }

    .abandon-result.shame {
      border: 2px solid rgba(194, 65, 78, 0.35);
      background: linear-gradient(160deg, #fff, #fff1f2);
    }

    .abandon-result.mercy {
      border: 2px solid rgba(119, 104, 90, 0.24);
      background: linear-gradient(160deg, #fff, #f7f3ef);
    }

    .quote {
      margin: 14px 0 0;
      padding: 14px;
      border-radius: 17px;
      color: #5f5048;
      background: rgba(255, 255, 255, 0.76);
      line-height: 1.75;
      text-align: left;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: max(22px, env(safe-area-inset-bottom));
      z-index: 130;
      padding: 11px 16px;
      border-radius: 999px;
      color: #fff;
      background: rgba(55, 43, 35, 0.9);
      font-size: 13px;
      font-weight: 850;
      transform: translate(-50%, 18px);
      opacity: 0;
      pointer-events: none;
      transition: 0.22s;
    }

    .toast.show {
      transform: translate(-50%, 0);
      opacity: 1;
    }

    @media (max-width: 520px) {
      .route-card {
        min-height: 145px;
      }

      .candidate-meta,
      .info-grid {
        grid-template-columns: 1fr 1fr;
      }

      .room-caption {
        max-width: 78%;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="screen active" id="startScreen">
      <div class="hero">
        <div class="logo" id="logoArt"></div>
        <h1>云养小猫</h1>
        <p class="subtitle">
          获得一只猫，陪它生活、长大，并承担每一次选择带来的后果。
        </p>
      </div>

      <div class="continue-box" id="continueBox">
        <strong id="continueTitle"></strong>
        <p class="subtitle" id="continueText"></p>

        <div class="button-row">
          <button class="primary" id="continueBtn">继续养猫</button>
          <button class="secondary" id="newGameBtn">重新开始</button>
        </div>
      </div>

      <h2 class="section-title">先获得一只小猫</h2>

      <div class="route-grid">
        <button class="route-card" data-route="shelter">
          <span class="route-icon">🏠</span>
          <span class="route-name">救助站领养</span>
          <span class="route-desc">
            可以领养幼猫，也可以挑选性格已经确定的成年猫。
          </span>
        </button>

        <button class="route-card" data-route="mother">
          <span class="route-icon">🐈</span>
          <span class="route-name">猫妈妈送来</span>
          <span class="route-desc">
            持续投喂猫妈妈后，它把一只小猫带到了你面前。
          </span>
        </button>

        <button class="route-card" data-route="rain">
          <span class="route-icon">🌧️</span>
          <span class="route-name">雨天救助</span>
          <span class="route-desc">
            纸箱里的小猫可能很乖，也可能非常不好惹。
          </span>
        </button>

        <button class="route-card" data-route="friend">
          <span class="route-icon">🎁</span>
          <span class="route-name">朋友家的幼猫</span>
          <span class="route-desc">
            朋友家的猫生了一窝宝宝，你可以带走其中一只。
          </span>
        </button>

        <button class="route-card" data-route="shop">
          <span class="route-icon">🛍️</span>
          <span class="route-name">宠物店购买</span>
          <span class="route-desc">
            幼年只有灵珠或魔丸，成年仍可能成为耄耋。
          </span>
        </button>

        <button class="route-card" data-route="mystery">
          <span class="route-icon">✨</span>
          <span class="route-name">神秘事件</span>
          <span class="route-desc">
            来历不明，三种性格完全等概率。
          </span>
        </button>
      </div>
    </section>

    <section class="screen" id="shelterScreen">
      <div class="panel">
        <button class="back-link" data-go="startScreen">← 返回</button>

        <h2>救助站领养</h2>

        <p class="subtitle">
          成年猫会提前公开性格，领养后不会再发生改变。
        </p>

        <div class="choice-list">
          <button class="adult-card" data-shelter="kitten">
            <div class="adult-title">
              <span>🐾 领养幼猫</span>
              <span class="personality-tag demon">性格未定型</span>
            </div>

            <div class="route-desc">
              当前随机，成年时重新定型一次。
            </div>
          </button>

          <button class="adult-card" data-adult="spirit">
            <div class="adult-title">
              <span>米粒 · 2岁</span>
              <span class="personality-tag spirit">灵珠</span>
            </div>

            <div class="route-desc">
              温顺亲人，适合第一次养猫。
            </div>
          </button>

          <button class="adult-card" data-adult="demon">
            <div class="adult-title">
              <span>麻薯 · 3岁</span>
              <span class="personality-tag demon">魔丸</span>
            </div>

            <div class="route-desc">
              喜欢推杯子和半夜跑酷，但会黏人。
            </div>
          </button>

          <button class="adult-card" data-adult="chaos">
            <div class="adult-title">
              <span>锅盖 · 4岁</span>
              <span class="personality-tag chaos">耄耋</span>
            </div>

            <div class="route-desc">
              有攻击和严重拆家记录。
            </div>
          </button>
        </div>
      </div>
    </section>

    <section class="screen" id="candidateScreen">
      <div class="panel candidate">
        <button class="back-link" id="candidateBack">← 重新选择</button>

        <div class="candidate-art" id="candidateArt"></div>

        <h2 id="candidateTitle"></h2>

        <div class="origin-story" id="originStory"></div>

        <div class="candidate-meta">
          <div class="meta-box">
            <small>年龄阶段</small>
            <strong id="candidateAge"></strong>
          </div>

          <div class="meta-box">
            <small>品种</small>
            <strong id="candidateBreed"></strong>
          </div>

          <div class="meta-box">
            <small>性别</small>
            <strong id="candidateSex"></strong>
          </div>

          <div class="meta-box">
            <small>当前性格</small>
            <strong id="candidatePersonality"></strong>
          </div>
        </div>

        <input
          class="name-input"
          id="catNameInput"
          maxlength="10"
          placeholder="给它取个名字"
        >

        <div class="button-row">
          <button class="secondary" id="rerollBtn">换一只看看</button>

    const Utils = (() => {
      const $ = selector =>
        document.querySelector(selector);

      const $$ = selector =>
        [...document.querySelectorAll(selector)];

      const clamp = (
        value,
        minimum = 0,
        maximum = 100
      ) =>
        Math.max(
          minimum,
          Math.min(maximum, value)
        );

      const pick = list =>
        list[
          Math.floor(Math.random() * list.length)
        ];

      function roll(weights) {
        const entries =
          Object.entries(weights);

        const total =
          entries.reduce(
            (sum, [, weight]) =>
              sum + weight,
            0
          );

        let number =
          Math.random() * total;

        for (const [key, weight] of entries) {
          number -= weight;

          if (number < 0) {
            return key;
          }
        }

        return entries.at(-1)[0];
      }

      function effectText(effects) {
        const labels = {
          health: "健康",
          trust: "信任",
          vitality: "活力",
          courage: "胆量",
          intimacy: "亲密",
          hunger: "饱腹",
          cleanliness: "清洁",
          damage: "房屋损坏",
          coins: "金币"
        };

        return Object
          .entries(effects || {})
          .filter(([, value]) => value)
          .map(([key, value]) => {
            const sign =
              value > 0 ? "+" : "";

            return `${labels[key]} ${sign}${value}`;
          });
      }

      return {
        $,
        $$,
        clamp,
        pick,
        roll,
        effectText
      };
    })();

    const Storage = (() => {
      const KEY =
        "cloudCatGameSave_v2";

      const OLD_KEY =
        "cloudCatGameSave_v1";

      function save(game) {
        localStorage.setItem(
          KEY,
          JSON.stringify(game)
        );
      }

      function load() {
        try {
          const raw =
            localStorage.getItem(KEY) ||
            localStorage.getItem(OLD_KEY);

          if (!raw) {
            return null;
          }

          const game =
            JSON.parse(raw);

          if (!game.breedKey) {
            const breedKeys =
              Object.keys(CONFIG.breeds);

            game.breedKey =
              breedKeys[
                Math.floor(
                  Math.random() * breedKeys.length
                )
              ];
          }

          if (!game.mood) {
            game.mood = "neutral";
          }

          return game;
        } catch {
          return null;
        }
      }

      function clear() {
        localStorage.removeItem(KEY);
        localStorage.removeItem(OLD_KEY);
      }

      return {
        save,
        load,
        clear
      };
    })();

            }
          },
          {
            emoji: "🌫️",
            title: "异常平静",
            body:
              "它今天只是远远盯着你，没有发动攻击。",
            effects: {
              trust: 1
            }
          },
          {
            emoji: "💡",
            title: "台灯倒下",
            body:
              "一声巨响后，台灯与地面完成了亲密接触。",
            effects: {
              damage: 15,
              coins: -8
            }
          }
        ]
      };

      function getAction(
        personality,
        action
      ) {
        const pack =
          common[action];

        const event =
          structuredClone(
            Utils.pick(pack[personality])
          );

        event.effects = {
          ...(pack.base || {}),
          ...(event.effects || {})
        };

        return event;
      }

      function getDay(personality) {
        return structuredClone(
          Utils.pick(dayEvents[personality])
        );
      }

      return {
        getAction,
        getDay
      };
    })();

    /* =========================
       6. 游戏状态模块
    ========================= */

    const Game = (() => {
      let game = null;
      let candidate = null;

      function get() {
        return game;
      }

      function set(value) {
        game = value;
      }

      function getCandidate() {
        return candidate;
      }

      function createCandidate(
        routeKey,
        forcedPersonality = null,
        forcedName = ""
      ) {
        const route =
          CONFIG.routes[routeKey];

        candidate = {
          routeKey,
          routeName: route.name,
          ageStage: route.ageStage,

          personality:
            forcedPersonality ||
            Utils.roll(route.initial),

          breedKey:
            Utils.pick(
              Object.keys(CONFIG.breeds)
            ),

          sex:
            Utils.pick(CONFIG.sexes),

          suggestedName:
            forcedName ||
            Utils.pick(CONFIG.names),

          story:
            route.story,

          rerollable:
            routeKey !== "shelterAdult"
        };

        return candidate;
      }

      function adopt(name) {
        const selected =
          candidate;

        const route =
          CONFIG.routes[selected.routeKey];

        const stats = {
          ...route.base
        };

        if (
          selected.personality === "spirit"
        ) {
          stats.trust += 8;
          stats.intimacy += 8;
        }

        if (
          selected.personality === "demon"
        ) {
          stats.vitality += 8;
        }

        if (
          selected.personality === "chaos"
        ) {
          stats.trust -= 10;
          stats.intimacy -= 8;
          stats.courage += 8;
        }

        Object
          .keys(stats)
          .forEach(key => {
            stats[key] =
              Utils.clamp(stats[key]);
          });

        const finalName =
          name ||
          selected.suggestedName;

        game = {
          version: 2,
          name: finalName,
          routeKey: selected.routeKey,
          routeName: selected.routeName,
          breedKey: selected.breedKey,
          sex: selected.sex,
          ageStage: selected.ageStage,
          personality: selected.personality,
          initialPersonality: selected.personality,
          personalityChanged: false,
          day: 1,
          actionsLeft: 4,
          coins: 100,
          houseDamage: 0,
          mood: "neutral",
          stats,

          logs: [
            `第1天：${finalName}来到你的家。`
          ]
        };

        Storage.save(game);

        return game;
      }

      function maxFor(key) {
        if (
          game.personality === "chaos" &&
          key === "trust"
        ) {
          return 45;
        }

        if (
          game.personality === "chaos" &&
          key === "intimacy"
        ) {
          return 35;
        }

        return 100;
      }

      function change(
        key,
        value
      ) {
        if (key === "damage") {
          game.houseDamage =
            Utils.clamp(
              game.houseDamage + value
            );

          return;
        }

        if (key === "coins") {
          game.coins =
            Math.max(
              0,
              game.coins + value
            );

          return;
        }

        game.stats[key] =
          Utils.clamp(
            game.stats[key] + value,
            0,
            maxFor(key)
          );
      }

      function apply(effects) {
        Object
          .entries(effects || {})
          .forEach(([key, value]) => {
            change(key, value);
          });
      }

      function log(text) {
        game.logs.unshift(
          `第${game.day}天：${text}`
        );

        game.logs =
          game.logs.slice(0, 40);
      }

      function action(actionKey) {
        if (
          !game ||
          game.actionsLeft <= 0
        ) {
          return null;
        }

        game.actionsLeft -= 1;

        const event =
          EventSystem.getAction(
            game.personality,
            actionKey
          );

        apply(event.effects);

        game.mood =
          event.effects.health < 0 ||
          event.effects.trust < 0
            ? "angry"
            : actionKey === "play"
              ? "happy"
              : actionKey === "feed"
                ? "happy"
                : "neutral";

        log(event.body);
        Storage.save(game);

        return event;
      }

      function endDay() {
        game.day += 1;
        game.actionsLeft = 4;

        change("hunger", -18);
        change("cleanliness", -11);
        change("vitality", 18);

        if (game.stats.hunger < 25) {
          change("health", -8);

          log(
            `${game.name}饿得没有精神，健康下降。`
          );
        }

        if (
          game.stats.cleanliness < 25
        ) {
          change("health", -6);

          log(
            `环境太脏，${game.name}的健康受到影响。`
          );
        }

        const event =
          EventSystem.getDay(
            game.personality
          );

        apply(event.effects);

        game.mood =
          event.effects.health < 0 ||
          event.effects.damage > 10
            ? "angry"
            : "sleepy";

        log(event.body);

        let growth = null;

        if (
          game.ageStage === "kitten" &&
          !game.personalityChanged &&
          game.day >= 7
        ) {
          growth = grow();
        }

        Storage.save(game);

        return {
          event,
          growth
        };
      }

      function grow() {
        const oldPersonality =
          game.personality;

        const newPersonality =
          Utils.roll(
            CONFIG.routes[
              game.routeKey
            ].growth
          );

        game.ageStage = "adult";
        game.personality =
          newPersonality;

        game.personalityChanged = true;

        game.mood =
          newPersonality === "chaos"
            ? "angry"
            : "neutral";

        let story = "";

        if (
          newPersonality === "spirit"
        ) {
          story =
            `${game.name}长大后安静了许多，` +
            "开始每天主动趴在你身边。";
        }

        if (
          newPersonality === "demon"
        ) {
          story =
            "你发现家里的杯子总会莫名其妙掉到地上。" +
            `监控里的${game.name}每次推完都会若无其事地走开。`;
        }

        if (
          newPersonality === "chaos"
        ) {
          story =
            `${game.name}静静看着你。下一秒，` +
            "它突然给了你一爪，随后转身抓坏了新沙发。";
        }

        log(
          `${game.name}成年了，性格从“` +
          `${CONFIG.personalities[oldPersonality].name}”` +
          `定型为“${CONFIG.personalities[newPersonality].name}”。`
        );

        return {
          old: oldPersonality,
          next: newPersonality,
          story
        };
      }

      return {
        get,
        set,
        getCandidate,
        createCandidate,
        adopt,
        maxFor,
        action,
        endDay
      };
    })();

        ) {

        overlay.classList.remove(
          "show"
        );

          eventCloseCallback;

        eventCloseCallback =
          null;

        if (callback) {
          callback();

    /* =========================
       9. 应用控制器
    ========================= */

    const App = (() => {
      const {
        $,
        $$
      } = Utils;

      function createAndShow(
        routeKey,
        forcedPersonality = null,
        forcedName = ""
      ) {
        Game.createCandidate(
          routeKey,
          forcedPersonality,
          forcedName
        );

        UI.renderCandidate();

        UI.showScreen(
          "candidateScreen"
        );
      }

      function bindNavigation() {
        $$("[data-route]").forEach(
          button => {
            button.addEventListener(
              "click",
              () => {
                const route =
                  button.dataset.route;

                if (route === "shelter") {
                  UI.showScreen(
                    "shelterScreen"
                  );
                } else {
                  createAndShow(route);
                }
              }
            );
          }
        );

        $$("[data-go]").forEach(
          button => {
            button.addEventListener(
              "click",
              () => {
                const target =
                  button.dataset.go;

                if (
                  target === "homeScreen"
                ) {
                  UI.renderHome();
                }

                UI.showScreen(target);
              }
            );
          }
        );

        $("[data-shelter='kitten']")
          .addEventListener(
            "click",
            () => {
              createAndShow(
                "shelterKitten"
              );
            }
          );

        $$("[data-adult]").forEach(
          button => {
            button.addEventListener(
              "click",
              () => {
                const personality =
                  button.dataset.adult;

                const names = {
                  spirit: "米粒",
                  demon: "麻薯",
                  chaos: "锅盖"
                };

                createAndShow(
                  "shelterAdult",
                  personality,
                  names[personality]
                );
              }
            );
          }
        );

        $("#candidateBack")
          .addEventListener(
            "click",
            () => {
              const selected =
                Game.getCandidate();

              const target =
                selected.routeKey.startsWith(
                  "shelter"
                )
                  ? "shelterScreen"
                  : "startScreen";

              UI.showScreen(target);
            }
          );

        $("#rerollBtn")
          .addEventListener(
            "click",
            () => {
              createAndShow(
                Game.getCandidate().routeKey
              );
            }
          );

        $("#attributeBtn")
          .addEventListener(
            "click",
            () => {
              UI.renderAttributes();

              UI.showScreen(
                "attributeScreen"
              );
            }
          );
      }

      function bindGame() {
        $("#adoptBtn")
          .addEventListener(
            "click",
            () => {
              const name =
                $("#catNameInput")
                  .value
                  .trim();

              Game.adopt(name);

              UI.renderHome();
              UI.updateContinue();

              UI.showScreen(
                "homeScreen"
              );
            }
          );

        $$(".action-btn").forEach(
          button => {
            button.addEventListener(
              "click",
              () => {
                const event =
                  Game.action(
                    button.dataset.action
                  );

                if (!event) {
                  UI.toast(
                    "今天已经没有行动次数了"
                  );

                  return;
                }

                UI.renderHome();
                UI.showEvent(event);
              }
            );
          }
        );

        $("#sleepBtn")
          .addEventListener(
            "click",
            () => {
              const result =
                Game.endDay();

              UI.renderHome();

              UI.showEvent(
                result.event,
                () => {
                  if (result.growth) {
                    UI.renderHome();
                    UI.showGrowth(
                      result.growth
                    );
                  }
                }
              );
            }
          );

        $("#saveBtn")
          .addEventListener(
            "click",
            () => {
              Storage.save(Game.get());

              UI.toast(
                "进度已保存"
              );
            }
          );

        $("#resetBtn")
          .addEventListener(
            "click",
            () => {
              const confirmed =
                confirm(
                  "确定删除当前存档吗？"
                );

              if (!confirmed) {
                return;
              }

              Storage.clear();
              Game.set(null);
              UI.updateContinue();

              UI.showScreen(
                "startScreen"
              );
            }
          );

        $("#continueBtn")
          .addEventListener(
            "click",
            () => {
              Game.set(
                Storage.load()
              );

              UI.renderHome();

              UI.showScreen(
                "homeScreen"
              );
            }
          );

        $("#newGameBtn")
          .addEventListener(
            "click",
            () => {
              const confirmed =
                confirm(
                  "开始新游戏会删除当前存档，确定吗？"
                );

              if (!confirmed) {
                return;
              }

              Storage.clear();
              Game.set(null);
              UI.updateContinue();
            }
          );
      }

      function bindModals() {
        $("#eventOverlay")
          .addEventListener(
            "click",
            UI.closeEvent
          );

        $("#growthClose")
          .addEventListener(
            "click",
            () => {
              $("#growthOverlay")
                .classList
                .remove("show");

              Storage.save(Game.get());
              UI.renderHome();
            }
          );

        $("#abandonBtn")
          .addEventListener(
            "click",
            Abandon.open
          );

        $("#cancelAbandon")
          .addEventListener(
            "click",
            () => {
              $("#abandonConfirm")
                .classList
                .remove("show");
            }
          );

        $("#confirmAbandon")
          .addEventListener(
            "click",
            Abandon.confirm
          );

        $("#leaveAbandon")
          .addEventListener(
            "click",
            () => {
              $("#abandonResult")
                .classList
                .remove("show");

              UI.showScreen(
                "startScreen"
              );
            }
          );

        [
          "#abandonConfirm",
          "#growthOverlay"
        ].forEach(selector => {
          $(selector).addEventListener(
            "click",
            event => {
              if (
                event.target ===
                event.currentTarget
              ) {
                event.currentTarget
                  .classList
                  .remove("show");
              }
            }
          );
        });
      }

      function init() {
        $("#logoArt").innerHTML =
          Art.logoSVG();

        UI.updateContinue();

        bindNavigation();
        bindGame();
        bindModals();
      }

      return {
        init
      };
    })();

    function main() {
      App.init();
    }

    document.addEventListener(
      "DOMContentLoaded",
      main
    );
  </script>
</body>
</html>
